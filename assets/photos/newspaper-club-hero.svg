  <text x="78" y="294" fill="#fffaf0" font-family="Georgia,serif" font-size="54" font-weight="700">SCHOOL PAPER.</text>
  <text x="78" y="362" fill="#ffcb21" font-family="Georgia,serif" font-size="54" font-weight="700">NOW WHAT?</text>
