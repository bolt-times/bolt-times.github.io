      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#020d24" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="560" fill="url(#sky)"/>
  <circle cx="1050" cy="90" r="155" fill="none" stroke="#7ea8e8" stroke-opacity=".22" stroke-width="2"/>
